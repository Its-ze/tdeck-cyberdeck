name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record installer deployment revision
        env:
          INSTALLER_SHA: ${{ github.sha }}
        run: python3 -c 'import json,os,pathlib; pathlib.Path("docs/revision.json").write_text(json.dumps({"installer_sha":os.environ["INSTALLER_SHA"],"firmware_version":"0.2.12","firmware_source_sha":None,"hardware_acceptance":"candidate 0.2.15 pending"},indent=2)+"\n")'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
